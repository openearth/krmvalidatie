# Settings for download.py - nothing is hardcoded in the script.
# TOML is used because it allows comments and Python 3.11 reads it natively.

# Catalog filter on the 'WaardeBepalingsMethode.Code' column
method_code = "other:X156"

# Request codes, in the order the Waterinfo API expects them:
# [compartiment, eenheid, meetapparaat, grootheid, locatie, start, end]
compartiment_code = "OR"
eenheid_code = ""
meetapparaat_code = ""
grootheid_code = "AANTPLTE"

# Period to download (YYYY-MM-DD)
start_date = "2022-12-31"
end_date = "2023-12-31"

# Parallel downloads per request
max_workers = 8

# Only process the first N locations, 0 = all. Handy for a quick test run.
limit_locations = 0

# Where the CSV files are written. Relative paths are resolved against this file.
output_dir = "../../../data/waterinfo"
